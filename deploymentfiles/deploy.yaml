apiVersion: apps/v1
kind: Deployment
metadata:
  name: vamshi-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vamshi-project
  template:
    metadata:
      labels:
        app: vamshi-project
    spec:
      containers:
        - name: vamshi-project
          image: vamshi567/vamshi-project:21
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: vamshi-project-service
spec:
  type: NodePort
  selector:
    app: vamshi-project
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
